name: Daily Briefing

# The claude.ai routine (free under the Claude subscription) researches and
# composes the briefing and EMAILS it. This Action fetches that email via the
# Gmail API and publishes it — no Claude API call, so no metered cost.
#
# Background: the routine's sandbox can no longer write to api.github.com (its
# managed GitHub proxy rejects the hardcoded PAT -> "502 builtin injection
# failed"). A GitHub Action has native GitHub access, so it handles the publish
# the sandbox can't.

# GitHub runs free scheduled workflows on a best-effort queue and DROPS them
# outright under load — on 2026-08-27 this workflow never fired at all, and the
# week before it had been drifting later each day (14:53 -> 15:58). So we take
# four standby seats instead of one, on odd minutes (:00 and :30 are the most
# congested). publish_from_email.py exits 0 when today's file already exists, so
# every rung after the one that wins is a ~15s no-op: no second commit, no second
# Slack post. Earliest rung is 14:23 UTC because the routine fires at 14:00 and
# its email has landed as late as 14:25; the script itself then waits up to 4 min.
on:
  schedule:
    - cron: '23 14 * * 1-5'   # 14:23 UTC Mon–Fri — primary
    - cron: '52 14 * * 1-5'   # 14:52 UTC — retry
    - cron: '26 15 * * 1-5'   # 15:26 UTC — retry
    - cron: '11 16 * * 1-5'   # 16:11 UTC — last chance (9:11am PT); only this
                              # rung emails on failure, so a genuinely broken day
                              # alerts once instead of four times
  workflow_dispatch:           # lets you run it on demand to test

permissions:
  contents: write              # to commit + push today's briefing file

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch briefing from email and write file
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python .github/scripts/publish_from_email.py

      - name: Detect new briefing file
        id: detect
        run: |
          FILE=$(git status --porcelain briefings/ | awk '{print $2}' | head -n 1)
          if [ -n "$FILE" ]; then
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "file=$FILE" >> "$GITHUB_OUTPUT"
            echo "New briefing: $FILE"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No new briefing (already published today, or skipped)."
          fi

      - name: Commit & push
        if: steps.detect.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefings/
          git commit -m "Briefing $(date -u +%Y-%m-%d)"
          git push

      - name: Post to Slack
        if: steps.detect.outputs.created == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BRIEFING_FILE: ${{ steps.detect.outputs.file }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python .github/scripts/post_to_slack.py

      # Failures go to Isabel by email, never to Slack. Slack carries content only.
      # Only the final rung (and a manual run) alerts — an earlier rung failing
      # just means the routine's email hasn't landed yet, which a later rung fixes.
      - name: Email Isabel on failure
        if: >-
          failure() && (github.event_name == 'workflow_dispatch'
          || github.event.schedule == '11 16 * * 1-5')
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          python .github/scripts/notify_error_email.py \
            "⚠️ Daily Briefing Action failed — $(date -u +%Y-%m-%d)" \
            "The Daily Briefing Action failed. Today's briefing was not published."
