name: Zenie Live Posts Check

# On-demand diagnostic: lists what is actually live on Zenie's Instagram and the
# connected Facebook page, so the Zenie Posts table in Notion can be reconciled.
# Saves the result to reports/zenie-live-posts.json.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List live posts
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: python3 .github/scripts/list_live_posts.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/zenie-live-posts.json
          git diff --staged --quiet || git commit -m "Zenie live posts check $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
